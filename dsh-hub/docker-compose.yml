version: '3.8'

services:
  dsh-hub:
    build: .
    container_name: dsh-hub
    restart: unless-stopped
    ports:
      - "3082:3082"
    environment:
      - NODE_ENV=production
      - DSH_HUB_DATA=/data
      - DSH_HUB_HOST=0.0.0.0
      - DSH_HUB_PORT=3082
      - DSH_HUB_TRUST_PROXY=1
      - DSH_HUB_COOKIE_SECURE=1
      - DSH_BIN=/usr/local/bin/dsh
      # 可选：配置域名
      # - DSH_HUB_DOMAIN=hub.wuyajun.cn
      # 可选：配置 SMTP（邮件通知）
      # - SMTP_HOST=smtp.example.com
      # - SMTP_PORT=587
      # - SMTP_USER=user@example.com
      # - SMTP_PASS=password
      # - SMTP_FROM=noreply@example.com
    volumes:
      # ⚠️ 关键：将 /data 挂载到持久化存储
      # 方式 1：使用 Docker 命名卷（推荐）
      - dsh-hub-data:/data
      # 方式 2：使用宿主机目录（取消注释并修改路径）
      # - /opt/dsh-hub-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3082/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  dsh-hub-data:
    driver: local
    # 可选：指定驱动选项（如使用 NFS 等）
    # driver_opts:
    #   type: nfs
    #   o: addr=192.168.1.100,rw
    #   device: ":/path/to/nfs/share"
