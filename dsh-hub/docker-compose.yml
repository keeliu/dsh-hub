version: '3.8'
services:
  dsh-hub:
    build:
      context: ..
      dockerfile: dsh-hub/Dockerfile
    container_name: dsh-hub
    restart: unless-stopped
    ports:
      - "3082:3082"
    environment:
      - NODE_ENV=production
      - DSH_HUB_DATA=/data
      - DSH_HUB_HOST=0.0.0.0
      - DSH_HUB_PORT=3082
      - DSH_HUB_TRUST_PROXY=1
      - DSH_HUB_COOKIE_SECURE=1
      - DSH_BIN=/usr/local/bin/dsh
    volumes:
      - /data/dsh-hub:/data
    networks:
      1panel-network:
        ipv4_address: 172.18.0.3

networks:
  1panel-network:
    external: true
