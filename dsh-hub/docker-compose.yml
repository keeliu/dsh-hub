version: '3.8'

services:
  dsh-hub:
    build: .
    container_name: dsh-hub
    restart: unless-stopped
    ports:
      - "3082:3082"
    environment:
      - NODE_ENV=production
      - DSH_HUB_DATA=/data
      - DSH_HUB_HOST=0.0.0.0
      - DSH_HUB_PORT=3082
      - DSH_HUB_TRUST_PROXY=1
      - DSH_HUB_COOKIE_SECURE=1
      - DSH_BIN=/usr/local/bin/dsh
      # 可选：配置域名
      # - DSH_HUB_DOMAIN=hub.wuyajun.cn
      # 可选：配置 SMTP（邮件通知）
      # - SMTP_HOST=smtp.example.com
      # - SMTP_PORT=587
      # - SMTP_USER=user@example.com
      # - SMTP_PASS=password
      # - SMTP_FROM=noreply@example.com
    volumes:
      # 数据持久化：bind mount 到独立路径（不在 git 仓库内）
      - /data/dsh-hub:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3082/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
